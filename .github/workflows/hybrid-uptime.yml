name: Hybrid External Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hybrid-external-uptime
  cancel-in-progress: true

jobs:
  verify-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_APP_URL: https://tanaghum-backup.155-117-45-45.sslip.io
      PUBLIC_HEALTH_URL: https://tanaghum-backup.155-117-45-45.sslip.io/api/health
      UPTIME_CHECK_EVIDENCE_PATH: ops/evidence/hybrid-uptime-latest.json
      ALERT_EVIDENCE_PATH: ops/evidence/hybrid-alert-latest.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify public endpoint availability
        run: bash scripts/uptime-check.sh
      - name: Verify production security headers and HSTS
        run: node scripts/verify-security-headers.mjs
      - name: Notify configured external destination on failure
        if: failure()
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
          ALERT_SOURCE: github-hybrid-external-uptime
          ALERT_TITLE: Tanaghum temporary production external uptime failure
          ALERT_MESSAGE: GitHub-hosted uptime or security-header verification failed for the promoted recovery host. Review the workflow evidence and temporary production VPS status.
        run: node scripts/send-operations-alert.mjs github-hybrid-external-uptime
      - name: Create or update external GitHub incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_ASSIGNEE: tamerabuhalaweh
          ALERT_TITLE: '[Operations Alert] Temporary Hybrid production uptime failure'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "$ALERT_TITLE in:title" \
              --json number,title \
              --jq ".[] | select(.title == env.ALERT_TITLE) | .number" \
              | head -n 1
          )"
          incident_body="$(cat <<EOF
          The external GitHub-hosted monitor could not reach the promoted temporary Hybrid production application or its security-header checks failed.

          - Detected at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Workflow evidence: $RUN_URL
          - Target: Temporary Hybrid production at the promoted recovery host
          - Required action: inspect public health, VPS availability, application containers, database, Redis, backups, and edge routing.

          This issue contains no credentials or raw alert destination.
          EOF
          )"
          if [[ -n "$existing_number" ]]; then
            gh issue comment "$existing_number" --repo "$GITHUB_REPOSITORY" --body "$incident_body"
            incident_number="$existing_number"
            incident_action="updated"
          else
            incident_url="$(
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ALERT_TITLE" \
                --body "$incident_body" \
                --label "priority/p0" \
                --label "area/devops" \
                --assignee "$ALERT_ASSIGNEE"
            )"
            incident_number="${incident_url##*/}"
            incident_action="created"
          fi
          mkdir -p ops/evidence
          jq -n \
            --arg attemptedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg action "$incident_action" \
            --arg issueNumber "$incident_number" \
            --arg runUrl "$RUN_URL" \
            '{
              attemptedAt: $attemptedAt,
              source: "github-hybrid-external-uptime",
              status: "delivered",
              destination: "github_issue",
              destinationRecipient: "repository_owner",
              issueNumber: ($issueNumber | tonumber),
              workflowEvidence: $runUrl,
              rawDestinationReturned: false,
              action: $action
            }' > ops/evidence/github-incident-latest.json
      - name: Resolve recovered external GitHub incident
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: '[Operations Alert] Temporary Hybrid production uptime failure'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "$ALERT_TITLE in:title" \
              --json number,title \
              --jq ".[] | select(.title == env.ALERT_TITLE) | .number" \
              | head -n 1
          )"
          if [[ -n "$existing_number" ]]; then
            gh issue comment "$existing_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Temporary Hybrid production recovered at $(date -u +%Y-%m-%dT%H:%M:%SZ). Passing workflow evidence: $RUN_URL"
            gh issue close "$existing_number" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
          fi
      - name: Upload external uptime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-external-uptime-evidence
          path: ops/evidence
          if-no-files-found: warn
          retention-days: 30
